<style>
:root{
  --bg:#12141c;
  --panel:#1c202c;
  --panel2:#232838;
  --line:#333a4d;
  --ink:#eceef4;
  --ink-dim:#9aa1b8;
  --accent:#e3a857;
  --ok:#6fbf73;
  --bad:#e2637a;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: radial-gradient(ellipse 900px 500px at 15% -10%, #1c2233 0%, transparent 60%), var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:36px 20px 80px;}
header{margin-bottom:28px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(24px,5vw,34px);margin:0 0 8px;}
.sub{color:var(--ink-dim);font-size:15px;max-width:560px;line-height:1.5;}
.test-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;margin:0 auto;}
.test-start h2{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 10px;}
.test-start p{color:var(--ink-dim);font-size:14px;line-height:1.55;margin:0 0 16px;}
.q-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-bottom:14px;letter-spacing:.04em;}
.q-progress-bar{height:4px;background:var(--panel2);border-radius:2px;margin-bottom:22px;overflow:hidden;}
.q-progress-fill{height:100%;background:var(--accent);transition:width .3s;}
.q-word{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;margin-bottom:4px;}
.q-ipa{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;margin-bottom:22px;}
.q-cat{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
.q-prompt{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px;}
.q-options{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
.q-option{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 15px;font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.4;}
.q-option:hover:not(.locked){border-color:var(--accent);}
.q-option.correct{border-color:var(--ok);background:rgba(111,191,115,.12);}
.q-option.wrong{border-color:var(--bad);background:rgba(226,99,122,.12);}
.q-option.locked{cursor:default;}
.q-next{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bg);background:var(--accent);border:none;border-radius:8px;padding:10px 18px;cursor:pointer;}
.q-next:disabled{opacity:.3;cursor:not-allowed;}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn-accent{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 16px;border-radius:8px;cursor:pointer;background:var(--accent);color:var(--bg);border:none;text-decoration:none;display:inline-block;}
.word-list{margin:14px 0;font-size:13.5px;line-height:1.7;}
.word-list .w-ok{color:var(--ok);}
.word-list .w-bad{color:var(--bad);}
.big-pct{font-family:'Fraunces',Georgia,serif;font-size:44px;font-weight:700;margin:10px 0;}
.footer-note{color:var(--ink-dim);font-size:11.5px;margin-top:22px;text-align:center;font-family:'IBM Plex Mono',monospace;}
</style>

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function findWordEntry(category, word){
  const cat = DATA[category];
  if(!cat) return null;
  return cat.words.find(function(w){ return w[0] === word; }) || null;
}

function buildQuestions(group){
  const qs = [];
  (group.words || []).forEach(function(item){
    const entry = findWordEntry(item.category, item.word);
    if(!entry) return;
    const cat = DATA[item.category];
    const allDefs = cat.words.map(function(w){ return w[2]; });
    const word = entry[0], ipa = entry[1], def = entry[2];
    const distractors = [];
    let attempts = 0;
    while(distractors.length < 3 && attempts < 80){
      attempts++;
      const d = allDefs[Math.floor(Math.random()*allDefs.length)];
      if(d !== def && distractors.indexOf(d) === -1) distractors.push(d);
    }
    const options = shuffleArray([def].concat(distractors));
    qs.push({ word: word, ipa: ipa, category: item.category, def: def, options: options, correctIndex: options.indexOf(def) });
  });
  return shuffleArray(qs);
}

let state = {
  phase: 'loading',
  group: null,
  questions: [], answers: [], qIndex: 0,
  masteredCount: 0, pct: 0,
  saveError: null
};

function loadingHTML(){
  return '<div class="test-card test-start"><h2>One moment...</h2><p>Checking your account.</p></div>';
}

function accountErrorHTML(){
  const returnTo = encodeURIComponent(location.href.split('#')[0]);
  return '<div class="test-card test-start"><h2>We could not verify your account</h2><p>Your sign-in may have expired. Please sign in again.</p><div class="result-actions"><a class="btn-accent" href="' + LOGIN_URL + '?return_to=' + returnTo + '">Sign in again</a></div></div>';
}

function noRoundHTML(){
  return '<div class="test-card test-start"><h2>Nothing to check right now</h2><p>You do not have an open training round waiting for a check-in. Reach out to your instructor if you think that is wrong.</p></div>';
}

function introHTML(){
  const n = (state.group.words || []).length;
  return '<div class="test-card test-start"><h2>Round ' + state.group.round_number + ' check-in</h2><p>' + n + ' words from your last round. Answer as best you can, then submit.</p><div class="result-actions"><button class="btn-accent" id="start-check">Start</button></div></div>';
}

function questionHTML(){
  const q = state.questions[state.qIndex];
  const chosen = state.answers[state.qIndex];
  const locked = chosen !== null;
  const pct = Math.round((state.qIndex / state.questions.length) * 100);
  let optsHtml = '';
  q.options.forEach(function(opt, i){
    let cls = 'q-option';
    if(locked){
      if(i === q.correctIndex) cls += ' correct';
      else if(i === chosen) cls += ' wrong';
      else cls += ' locked';
      if(i !== chosen && i !== q.correctIndex) cls += ' locked';
      cls += ' locked';
    }
    optsHtml += '<button class="' + cls + '" data-i="' + i + '">' + escHtml(opt) + '</button>';
  });
  return '<div class="test-card">' +
    '<div class="q-progress">QUESTION ' + (state.qIndex + 1) + ' OF ' + state.questions.length + '</div>' +
    '<div class="q-progress-bar"><div class="q-progress-fill" style="width:' + pct + '%;"></div></div>' +
    '<div class="q-cat">' + escHtml(q.category) + '</div>' +
    '<div class="q-word">' + escHtml(q.word) + '</div>' +
    '<div class="q-ipa">' + escHtml(q.ipa) + '</div>' +
    '<div class="q-options">' + optsHtml + '</div>' +
    '<button class="q-next" id="q-next-btn" ' + (locked ? '' : 'disabled') + '>' + (state.qIndex < state.questions.length - 1 ? 'Next' : 'Finish') + '</button>' +
    '</div>';
}

function savingHTML(){
  return '<div class="test-card test-start"><h2>Saving...</h2><p>Hang tight, recording your results.</p></div>';
}

function doneHTML(){
  let rows = '';
  state.questions.forEach(function(q, i){
    const correct = state.answers[i] === q.correctIndex;
    rows += '<div class="' + (correct ? 'w-ok' : 'w-bad') + '">' + (correct ? '\u2713' : '\u2717') + ' ' + escHtml(q.word) + '</div>';
  });
  const congrats = state.pct >= 85
    ? '<p style="color:var(--ok);">Hearty congratulations, that clears the 85% bar for this round!</p>'
    : '<p>Not quite at 85% yet on this round. The missed words below will carry into the next round.</p>';
  const saveNote = state.saveError
    ? '<p style="color:var(--bad);">Your answers were scored, but saving failed (' + escHtml(state.saveError) + '). Please let your instructor know.</p>'
    : '<p style="color:var(--ink-dim);font-size:12.5px;">Saved. Your instructor will see this and follow up.</p>';
  return '<div class="test-card">' +
    '<div class="q-prompt">Round ' + state.group.round_number + ' results</div>' +
    '<div class="big-pct">' + state.pct + '%</div>' +
    congrats +
    '<div class="word-list">' + rows + '</div>' +
    saveNote +
    '</div>';
}

function render(){
  const root = document.getElementById('root');
  if(state.phase === 'loading') root.innerHTML = loadingHTML();
  else if(state.phase === 'account-error') root.innerHTML = accountErrorHTML();
  else if(state.phase === 'no-round') root.innerHTML = noRoundHTML();
  else if(state.phase === 'intro') root.innerHTML = introHTML();
  else if(state.phase === 'running') root.innerHTML = questionHTML();
  else if(state.phase === 'saving') root.innerHTML = savingHTML();
  else if(state.phase === 'done') root.innerHTML = doneHTML();
  wire();
}

function wire(){
  const root = document.getElementById('root');
  const startBtn = document.getElementById('start-check');
  if(startBtn) startBtn.onclick = startQuiz;
  const opts = root.querySelectorAll('.q-options .q-option');
  if(opts.length && state.answers[state.qIndex] === null){
    opts.forEach(function(o){ o.onclick = function(){ selectOption(parseInt(o.getAttribute('data-i'), 10)); }; });
  }
  const nextBtn = document.getElementById('q-next-btn');
  if(nextBtn) nextBtn.onclick = nextQuestion;
}

function startQuiz(){
  state.questions = buildQuestions(state.group);
  if(!state.questions.length){
    state.phase = 'no-round';
    render();
    return;
  }
  state.answers = new Array(state.questions.length).fill(null);
  state.qIndex = 0;
  state.phase = 'running';
  render();
}

function selectOption(i){
  if(state.answers[state.qIndex] !== null) return;
  state.answers[state.qIndex] = i;
  render();
}

function nextQuestion(){
  if(state.qIndex < state.questions.length - 1){
    state.qIndex++;
    render();
  } else {
    finishQuiz();
  }
}

async function finishQuiz(){
  const updatedWords = (state.group.words || []).map(function(w){
    const qIdx = state.questions.findIndex(function(q){ return q.word === w.word && q.category === w.category; });
    if(qIdx === -1) return w;
    const correct = state.answers[qIdx] === state.questions[qIdx].correctIndex;
    return { word: w.word, category: w.category, status: correct ? 'mastered' : 'missed' };
  });
  const masteredNow = updatedWords.filter(function(w){ return w.status === 'mastered'; }).length;
  const pct = updatedWords.length ? Math.round((masteredNow / updatedWords.length) * 1000) / 10 : 0;
  state.masteredCount = masteredNow;
  state.pct = pct;
  state.phase = 'saving';
  state.saveError = null;
  render();
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/vocab_training_groups?id=eq.' + encodeURIComponent(state.group.id), {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + userSession.access_token,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ words: updatedWords, status: 'completed', post_test_pct: pct, completed_at: new Date().toISOString() })
    });
    if(!res.ok){
      const t = await res.text().catch(function(){ return ''; });
      throw new Error('Save failed (' + res.status + '): ' + t);
    }
  }catch(e){
    state.saveError = e.message;
  }
  state.phase = 'done';
  render();
}

(async function init(){
  render();
  currentUser = await loadCurrentUser();
  if(!currentUser){
    state.phase = 'account-error';
    render();
    return;
  }
  const group = await loadOpenGroup(currentUser.id);
  if(!group){
    state.phase = 'no-round';
    render();
    return;
  }
  state.group = group;
  state.phase = 'intro';
  render();
})();
</script>
